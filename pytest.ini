[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    ns2: runs the real NS2 simulator (skipped automatically when NS2 is unavailable)
    network: executes real ping / traceroute / DNS against authorised destinations
    ui: Streamlit AppTest smoke tests of the user interface
    netlab: builds the isolated test network and uploads for real (needs Linux root or Docker; skipped otherwise)
filterwarnings =
    ignore::DeprecationWarning
